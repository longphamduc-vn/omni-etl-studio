[pytest]
# Đường dẫn mặc định để pytest quét test cases
testpaths = tests

# Mẫu tên file, class và function test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Tự động nạp PYTHONPATH là thư mục gốc dự án để import module core/, config/, drivers/ không bị lỗi
pythonpath = .

# Định nghĩa các Custom Markers để dễ dàng lọc nhóm test khi chạy
markers =
    unit: Danh mục các bài kiểm thử đơn vị (Unit Tests)
    integration: Danh mục các bài kiểm thử tích hợp (E2E Integration Tests)
    slow: Các bài test mất nhiều thời gian thực thi

# Cấu hình log hiển thị trực tiếp ra màn hình console khi test chạy
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Các tham số cờ bổ sung mặc định
addopts = 
    --strict-markers
    --tb=short
    -v